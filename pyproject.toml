[project]
name = "rlm-jev"
version = "0.1.0"
description = "Jev (System One) sub-calls for Recursive Language Models: batched classify / yes-no / locate tools for any RLM harness."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Hochenbaum" }]
dependencies = [
    "typesafe-sdk>=0.7.4",
]

[project.urls]
Repository = "https://github.com/jhochenbaum/rlm-jev"
Write-up = "https://www.jordanhochenbaum.com/blog/jev-rlm-sub-calls/"

[project.optional-dependencies]
dspy = ["dspy>=3.4.1,<3.5"]     # dspy.RLM + rlm_jev.dspy_rlm (relies on dspy.RLM internals; sandbox needs Deno)
rlm = ["rlms>=0.1"]             # alexzhang13/rlm example

[dependency-groups]
# Rebuilding results/summary.json and the figures from the committed results.
analysis = [
    "python-dotenv>=1.2",
    "pandas>=3.0",
    "numpy>=2.4",
    "matplotlib>=3.11",
]
# Everything needed to re-run the experiments in experiments/.
bench = [
    { include-group = "analysis" },
    "dspy>=3.4.1,<3.5",
    "datasets>=5.1",
    "pyarrow>=26.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1",
    "anthropic>=0.80",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["rlm_jev", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["rlm_jev"]  # experiments/ and jevlab/ run from the repo, not from the installed package

[tool.uv]
default-groups = ["bench", "dev"]
python-preference = "only-managed"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "private", "experiments/scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # ruff format enforces the width for code; prompts, regexes and figure captions stay on one line
    "E731",    # short lambdas are used deliberately in the analysis scripts
    "E741",    # `l` as a loop variable over lines
    "RUF001", "RUF002", "RUF003",  # typographic characters in prompts and corpus regexes are intentional
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]  # scripts put the repo on sys.path before importing jevlab
"figures/*.py" = ["E402"]
